<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公众号排版主题图鉴 · gzh-design</title>
<style>
  html { color-scheme: light dark; }
  body { margin: 0; padding: clamp(8px, 4vw, 48px) 8px; background: light-dark(#e8e4d9, #191918); }
  main { max-width: 980px; margin-inline: auto; }
  button { cursor: pointer; }
</style>
</head>
<body>
<main>
<section id="zh-wechat-theme-atlas" aria-label="公众号排版主题图鉴">
  <header class="atlas-header">
    <p>gzh-design · 公众号排版</p>
    <h1>主题图鉴</h1>
    <div class="atlas-intro">同一段文章，多套主题 + 配色变体。点选查看版式，把选中的主题指令随文章一起发给执行排版的 Agent。</div>
  </header>

  <div class="atlas-themes" role="group" aria-label="选择排版主题"></div>

  <div class="atlas-detail">
    <div class="atlas-proof">
      <div class="atlas-proof-label"><span>正文样张</span><span>各主题使用同一文案</span></div>
      <article class="atlas-article" aria-label="排版样张">
        <h3 class="proof-title">让交接有据可查</h3>
        <p class="proof-lead">一次交接结束后，也要让后来的人知道，事情是如何确认的。</p>
        <div class="proof-chapter"><span>01</span><h4>把过程记录下来</h4></div>
        <p class="proof-paragraph">把记录留在交接现场，让收到的人能<span>按顺序查到依据</span>。</p>
        <ol class="proof-steps">
          <li><span class="proof-number" aria-hidden="true">01</span><div><strong>登记</strong><p>写清交接对象和时间。</p></div></li>
          <li><span class="proof-number" aria-hidden="true">02</span><div><strong>核验</strong><p>由接收方核对并确认。</p></div></li>
        </ol>
        <blockquote class="proof-close">留下一份记录，也留下一条可追溯的线索。</blockquote>
      </article>
    </div>

    <aside class="atlas-selection" aria-label="所选主题信息">
      <div class="atlas-identity" aria-live="polite">
        <h2 class="atlas-name"></h2>
        <div class="atlas-palette" aria-label="主题主色"></div>
      </div>
      <dl>
        <div><dt>适合文章</dt><dd class="atlas-use"></dd></div>
        <div><dt>版式特征</dt><dd class="atlas-traits"></dd></div>
      </dl>
      <div class="atlas-action">
        <label for="zh-atlas-prompt">随文章发送这句话</label>
        <input id="zh-atlas-prompt" type="text" readonly>
        <button type="button" class="atlas-copy">复制主题指令</button>
        <p class="atlas-status" role="status"></p>
      </div>
    </aside>
  </div>
</section>

<style>

<script>
(() => {
  const atlas = document.getElementById('zh-wechat-theme-atlas');
  const themes = [
    { id: 'brand-blueprint', name: '品牌深蓝·蓝图（金）', main: '#020581', accent: '#D6A841', tint: '#E8EEFD', paper: '#FFFFFF', underline: '#2F6BFF',
      use: '科技/产业品牌的产品、技术科普，尤其配图是深蓝科技风 + 金色元素时。', traits: '深蓝章节条搭金色编号，浅金引言、蓝边能力卡和深蓝收束，默认配色。' },
    { id: 'brand-blueprint-silver', name: '品牌深蓝·蓝图（银）', main: '#0F1B4C', accent: '#B8BDC9', tint: '#EAF0FA', paper: '#FFFFFF', underline: '#5B6FB8',
      use: '同蓝图版式，换成午夜蓝 + 银灰点缀，气质更冷静、工业感更强。', traits: '午夜蓝章节条搭银灰编号，浅灰蓝引言卡，适合硬件、制造、安全类稿件。' },
    { id: 'brand-blueprint-copper', name: '品牌深蓝·蓝图（铜）', main: '#142850', accent: '#C77B3B', tint: '#EDF1F8', paper: '#FFFFFF', underline: '#4D6FA8',
      use: '同蓝图版式，换成藏青 + 铜橙点缀，比金色版更沉稳内敛。', traits: '藏青章节条搭铜色编号，暖灰蓝引言卡，适合深度评测、机制说明类稿件。' },
    { id: 'brand-blueprint-teal', name: '品牌深蓝·蓝图（青）', main: '#1B3A5C', accent: '#2FB6A3', tint: '#E7F6F3', paper: '#FFFFFF', underline: '#2FB6A3',
      use: '同蓝图版式，换成钢蓝 + 青绿点缀，更贴近互联网/数据科技气质。', traits: '钢蓝章节条搭青绿编号，浅青引言卡，适合算力、数据、云服务类稿件。' },
    { id: 'ink-seal', name: '宣纸·朱印', main: '#1C1C1A', accent: '#A92524', tint: '#F3E3DD', paper: '#FBF8F1', underline: '#A92524',
      use: '文化/历史叙事、有传承或匠心调性的科普、品牌年度总结。', traits: '水墨宣纸质感，朱印方框编号+墨色衬线标题，正文首行缩进 2em。' },
    { id: 'aurora-chain', name: '极光链语', main: '#2E2A6B', accent: '#00C2B8', tint: '#F2EFFC', paper: '#FFFFFF', underline: '#00C2B8',
      use: '区块链/分布式网络、算力、数据基础设施、面向未来的愿景类内容。', traits: '靛紫→紫罗兰渐变章节块，青色荧光编号与下划线，气质偏未来科技网络感。' },
    { id: 'stone-patina', name: '原石·雅痕', main: '#2B2824', accent: '#B8923F', tint: '#F7F1E2', paper: '#F8F6F1', underline: '#B8923F',
      use: '品牌故事、企业文化、年度/阶段性总结、高端产品发布。', traits: '暖灰白底+细金线点缀，不用深色大色块，留白最多、最克制的一套。' },
    { id: 'press-extra', name: '铅字·号外', main: '#111111', accent: '#C8102E', tint: '#EAE6DC', paper: '#F4F1EA', underline: '#C8102E',
      use: '热点快评、行业快讯、数据新闻、周报月报、事件复盘、立场鲜明的观点稿。', traits: '报头粗细双线、红底栏目号、通栏黑线、红字数据块、黑底"本期结论"卡，全直角报纸感。' },
    { id: 'memo-notebook', name: '便笺·手帐', main: '#2F3E5C', accent: '#F7D774', tint: '#FFF4C2', paper: '#FFFDF7', underline: '#F7D774',
      use: '新手教程、生活方式、读书学习笔记、团队日常与活动回顾、轻松向科普。', traits: '活页孔、和纸胶带章节（四色轮换）、荧光笔重点、便利贴、拍立得图片，唯一一套轻松向主题。' }
  ];

  const picker = atlas.querySelector('.atlas-themes');
  const article = atlas.querySelector('.atlas-article');
  const palette = atlas.querySelector('.atlas-palette');
  const prompt = atlas.querySelector('#zh-atlas-prompt');
  const status = atlas.querySelector('.atlas-status');
  const name = atlas.querySelector('.atlas-name');
  const use = atlas.querySelector('.atlas-use');
  const traits = atlas.querySelector('.atlas-traits');
  const storageKey = 'gzh-design-atlas-theme';
  const buttons = new Map();

  function applyTheme(element, theme) {
    element.dataset.theme = theme.id;
    element.style.setProperty('--main', theme.main);
    element.style.setProperty('--tint', theme.tint);
    element.style.setProperty('--paper', theme.paper);
    element.style.setProperty('--underline', theme.underline);
    if (theme.accent) element.style.setProperty('--accent', theme.accent);
  }

  function showTheme(theme) {
    for (const [id, button] of buttons) button.setAttribute('aria-pressed', String(id === theme.id));
    applyTheme(article, theme);
    name.textContent = theme.name;
    use.textContent = theme.use;
    traits.textContent = theme.traits;
    prompt.value = `公众号排版主题：${theme.name}`;
    status.textContent = '';
    palette.replaceChildren(...[theme.main, theme.accent].filter(Boolean).map((color) => {
      const chip = document.createElement('span');
      const dot = document.createElement('i');
      dot.setAttribute('aria-hidden', 'true');
      dot.style.setProperty('--swatch', color);
      chip.append(dot, color);
      return chip;
    }));
  }

  function restoreTheme(id) {
    const theme = themes.find((entry) => entry.id === id);
    if (theme) showTheme(theme);
  }

  function saveTheme(theme) {
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState({ modelContent: { theme: theme.name }, privateContent: { themeId: theme.id } }).catch(() => {});
      return;
    }
    try { localStorage.setItem(storageKey, theme.id); } catch {}
  }

  for (const theme of themes) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'atlas-option cursor-interaction';
    button.innerHTML = '<span class="atlas-mini" aria-hidden="true"><span class="mini-top"></span><span class="mini-heading"></span><span class="mini-body"></span></span>';
    const label = document.createElement('span');
    label.className = 'atlas-option-name';
    const [prefix, suffix] = theme.name.split('·');
    if (suffix) {
      const end = document.createElement('span');
      end.textContent = suffix;
      label.append(prefix + '·', document.createElement('wbr'), end);
    } else {
      label.textContent = theme.name;
    }
    button.append(label);
    applyTheme(button, theme);
    button.addEventListener('click', () => { showTheme(theme); saveTheme(theme); });
    picker.append(button);
    buttons.set(theme.id, button);
  }

  atlas.querySelector('.atlas-copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(prompt.value);
      status.textContent = '已复制，可直接粘贴到文章消息。';
    } catch {
      prompt.focus();
      prompt.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch {}
      status.textContent = copied ? '已复制，可直接粘贴到文章消息。' : '已选中文字，请手动复制。';
    }
  });
  prompt.addEventListener('focus', () => prompt.select());

  showTheme(themes[0]);
  if (window.openai) {
    restoreTheme(window.openai.widgetState?.privateContent?.themeId);
    window.addEventListener('openai:set_globals', (event) => restoreTheme(event.detail?.globals?.widgetState?.privateContent?.themeId));
  } else {
    try { restoreTheme(localStorage.getItem(storageKey)); } catch {}
  }
})();
</script>
</main>
</body>
</html>
